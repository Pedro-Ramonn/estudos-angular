<app-container>
    <app-cabecalho></app-cabecalho>
  
    <input
      type="search"
      placeholder="Pesquisar contatos"
      [(ngModel)]="filtroPorTexto"
    />
    <div class="botoes">
      <button type="button" class="botao-salvar" routerLink="/formulario">Adicionar Contato</button>
    </div>
  
    @for (letra of alfabeto; track letra) {
    <app-separador> {{ letra }} </app-separador>
    @for(contato of filtrarContatosPorLetraInicial(letra); track contato.id) {
      <app-contato 
      [nome]="contato.nome" 
      [telefone]="contato.telefone"
      [id]="contato.id"
      ></app-contato>
  } } 
  </app-container>
